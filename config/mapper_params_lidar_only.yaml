slam_toolbox:
  ros__parameters:

    # ── Solver ────────────────────────────────────────────────────────────
    solver_plugin:              solver_plugins::CeresSolver
    ceres_linear_solver:        SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner:       SCHUR_JACOBI
    ceres_trust_strategy:       LEVENBERG_MARQUARDT
    ceres_dogleg_type:          TRADITIONAL_DOGLEG
    ceres_loss_function:        None

    # ── Frames ────────────────────────────────────────────────────────────
    # No real odometry source — slam_toolbox will publish odom itself,
    # purely from scan matching. base_frame must match your real robot's
    # lidar-carrying frame chain (base_link or base_footprint, whichever
    # your static TF tree uses).
    odom_frame:   odom
    map_frame:    map
    base_frame:   base_link
    scan_topic:   /scan

    mode:                       mapping
    use_map_saver:               false

    # ── Travel gating (THIS WAS MISSING) ─────────────────────────────────
    # slam_toolbox will not even ATTEMPT to process a new scan into the
    # map until the robot has moved at least this far / turned at least
    # this much since the last accepted scan. The library default is
    # 0.5 m / 0.5 rad, which is far too coarse for careful, slow-speed
    # testing — small deliberate movements below this threshold are
    # silently ignored (no log message), which is exactly why the map
    # can appear "frozen" even while /scan keeps updating live.
    minimum_travel_distance:     0.1     # metres
    minimum_travel_heading:      0.1     # radians (~5.7 degrees)

    # ── Scan-matching tuned for NO ODOMETRY ──────────────────────────────
    # Since there's no odom prior, the matcher's correlation search window
    # must be large enough to find the right alignment from scratch every
    # scan. This is the single biggest knob to compensate for missing
    # encoder data.
    debug_logging:               false
    throttle_scans:              1
    transform_publish_period:    0.05      # 20 Hz; slam_toolbox owns odom→map
    map_update_interval:         2.0       # update map more frequently
    resolution:                  0.05
    max_laser_range:             12.0
    minimum_time_interval:       0.3       # allow closer-spaced scan matches
    transform_timeout:           0.3
    tf_buffer_duration:          30.0
    stack_size_to_use:           40000000

    # ── Wider correlation search (compensates for no odometry prior) ───
    # Default (with odom) is usually ~0.5 m / 0.5 rad. Without odom, the
    # robot could have moved further than expected between scans, so we
    # widen both linear and angular search space substantially.
    correlation_search_space_dimension:      1.0     # metres (was 0.5)
    correlation_search_space_resolution:     0.01
    correlation_search_space_smear_deviation: 0.1

    loop_search_space_dimension:             8.0
    loop_search_space_resolution:            0.05
    loop_search_space_smear_deviation:       0.03

    # ── Loop closure ─────────────────────────────────────────────────────
    do_loop_closing:             true
    loop_search_maximum_distance: 3.0
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_covariance: 3.0
    loop_match_minimum_response_fine:       0.35
    loop_match_minimum_response_coarse:     0.35

    # ── Penalties — slightly relaxed since there's no odometry to trust ──
    distance_variance_penalty:   0.5
    angle_variance_penalty:      1.0

    fine_search_angle_offset:    0.00349
    coarse_search_angle_offset:  0.349
    coarse_angle_resolution:     0.0349
    minimum_angle_penalty:       0.9
    minimum_distance_penalty:    0.5
    use_response_expansion:      true

    # ── Scan buffer ──────────────────────────────────────────────────────
    # A bigger scan buffer helps recover from a single bad/ambiguous match
    # since there's no odometry to "anchor" frame-to-frame trust.
    scan_buffer_size:             15
    scan_buffer_maximum_scan_distance: 12.0
    link_match_minimum_response_fine: 0.35
    link_scan_maximum_distance:   2.0

    # ── Misc ─────────────────────────────────────────────────────────────
    enable_interactive_mode:     false