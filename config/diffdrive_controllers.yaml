controller_manager:
  ros__parameters:
    update_rate: 30  # Hz

    diff_cont:
      type: diff_drive_controller/DiffDriveController

diff_cont:
  ros__parameters:
    left_wheel_names: ["left_wheel_joint"]
    right_wheel_names: ["right_wheel_joint"]

    wheel_separation: 0.34   # CHANGE to your actual measured value (metres)
    wheel_radius: 0.05       # CHANGE to your actual measured value (metres)

    use_stamped_vel: false   # accept plain geometry_msgs/Twist, not TwistStamped

    # No real encoder feedback -- integrate commanded velocity directly.
    open_loop: true

    # rf2o is the sole source of odom->base_link. If this were true,
    # diff_cont would also try to broadcast that same transform and
    # fight with rf2o (flickering/jumping TF).
    enable_odom_tf: false

    cmd_vel_timeout: 0.5
    publish_rate: 30.0

    base_frame_id: base_link
    odom_frame_id: odom
