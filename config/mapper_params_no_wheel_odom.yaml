slam_toolbox:
  ros__parameters:

    # --- Solver plugin ---
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # --- Frames / topics ---
    # odom_frame here is fed by rf2o_laser_odometry (pure lidar), not wheels.
    odom_frame: odom
    map_frame: map
    base_frame: base_link        # CHANGE to match your URDF base frame name
    scan_topic: /scan
    mode: mapping

    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.02
    map_update_interval: 1.0
    resolution: 0.05
    max_laser_range: 8.0         # set to your lidar's reliable max range
    minimum_time_interval: 0.2
    transform_timeout: 0.2
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000
    enable_interactive_mode: false

    # --- Motion thresholds ---
    # Lower than default (0.5/0.5) since the rf2o prior drifts faster than
    # wheel odom would -- we want slam_toolbox correcting more frequently
    # rather than trusting the prior over a long stretch.
    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.1
    minimum_travel_heading: 0.1
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 10.0

    # --- Loop closure ---
    # Widened/relaxed vs. defaults: your room only has corners + one box
    # as real features, so loop closure needs to trigger readily whenever
    # any of them re-enter the scan, not just on long revisits.
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.5
    loop_search_maximum_distance: 5.0
    do_loop_closing: true
    loop_match_minimum_chain_size: 6
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.3
    loop_match_minimum_response_fine: 0.4

    # --- Correlation (scan matcher search space) ---
    # Widened vs. defaults (0.3/0.03) because the motion prior from rf2o
    # is weaker/noisier than wheel odom -- give the matcher more room to
    # find the right alignment per scan.
    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1

    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    # --- Scan matcher penalties ---
    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.0
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true